[project]
name = "cairn"
version = "0.1.0"
description = "Campsite-discovery scorer — MCDA over OSM + Terrarium elevation, for a teardrop camper"
authors = [
    { name = "Jeremy Yunis", email = "jeremy@klinedrive.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
cairn = "cairn.main:run"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Note on TLC-1 enforcement: ruff's banned-api (TID251) is global-or-nothing
# and these primitives (time/random/uuid) are legitimate elsewhere, so a
# global ban would be noise. TLC-1 purity for engine/scoring.py and the
# feature-normalization helpers is instead enforced by a dedicated, precise
# AST/token test — tests/unit/test_tlc1_purity.py — added with those modules.
