# nginx site for Cairn — reverse proxy cairn.home.arpa -> localhost:9931.
# Install: copy to /etc/nginx/sites-available/cairn.conf, symlink into
# sites-enabled/, `sudo nginx -t`, `sudo systemctl reload nginx`.
# The pihole wildcard *.home.arpa -> 100.64.0.1 already covers the hostname.
server {
    listen 80;
    server_name cairn.home.arpa;

    location / {
        proxy_pass http://localhost:9931;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
server {
    listen 443 ssl;
    server_name cairn.home.arpa;
    include snippets/home-ssl.conf;

    location / {
        proxy_pass http://localhost:9931;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
