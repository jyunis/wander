# nginx site for the app (UI name "Wander") — reverse proxy to localhost:9931.
# Primary host wander.home.arpa; cairn.home.arpa kept as an alias so old links work.
# Install: copy to /etc/nginx/sites-available/cairn.conf, symlink into
# sites-enabled/, `sudo nginx -t`, `sudo systemctl reload nginx`.
# The pihole wildcard *.home.arpa -> 100.64.0.1 + the *.home.arpa cert both cover
# wander.home.arpa, so no DNS or cert change is needed.
#
# Satellite tiles are cached locally: see deploy/tile-cache.conf (the cache zone,
# -> /etc/nginx/conf.d/) and deploy/wander-tiles.conf (the proxy location, ->
# /etc/nginx/snippets/, included in both server blocks below). The MapTiler key
# lives in the host-only snippets/maptiler-key.conf (NOT in this repo).
server {
    listen 80;
    server_name wander.home.arpa cairn.home.arpa;

    include snippets/wander-tiles.conf;   # cached satellite tile proxy (/tiles/...)

    location / {
        proxy_pass http://localhost:9931;
        # "Score this view" runs synchronously; a near-cap score of a lake-dense
        # forest (e.g. Superior NF / BWCA) can take ~100s — above nginx's 60s
        # default, which 504s the request. Allow more than the app's own 120s
        # sync wall-clock bound so the app's typed error surfaces instead of a
        # gateway timeout. (The slow path itself — the per-candidate water
        # distance query — is tracked separately.)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
server {
    listen 443 ssl;
    server_name wander.home.arpa cairn.home.arpa;
    include snippets/home-ssl.conf;

    include snippets/wander-tiles.conf;   # cached satellite tile proxy (/tiles/...)

    location / {
        proxy_pass http://localhost:9931;
        # "Score this view" runs synchronously; a near-cap score of a lake-dense
        # forest (e.g. Superior NF / BWCA) can take ~100s — above nginx's 60s
        # default, which 504s the request. Allow more than the app's own 120s
        # sync wall-clock bound so the app's typed error surfaces instead of a
        # gateway timeout. (The slow path itself — the per-candidate water
        # distance query — is tracked separately.)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
