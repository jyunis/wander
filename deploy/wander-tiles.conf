# Tile-proxy + cache locations for Wander's satellite basemaps. Included by BOTH
# server blocks in cairn.conf (so it works whether the page is loaded over http
# or https). Install: copy to /etc/nginx/snippets/wander-tiles.conf.
#
# Two cached satellite sources at distinct paths (the app picks via the basemap
# menu), sharing the one disk cache (zone `tiles`, in conf.d/tile-cache.conf):
#   /tiles/esri/{z}/{x}/{y}       -> Esri World Imagery  (default; keyless, NO quota)
#   /tiles/satellite/{z}/{x}/{y}  -> MapTiler satellite   (key server-side; 100k/mo)
# Labels (incl. lakes) come from transparent Esri reference overlays drawn on top,
# client-side, on either source.

# Why every proxy_pass below goes through a $variable: putting the hostname in a
# variable forces nginx to re-resolve it per request (honouring the resolver's
# valid= TTL in conf.d/tile-cache.conf) instead of pinning addresses at config
# load the way an `upstream` block does. Naming the host directly here — even
# without an upstream block — would pin it again. See tile-cache.conf for the
# outage this caused. Cost of dropping the upstream blocks: no upstream
# keepalive, so a cache MISS pays a TLS handshake (~10-20ms to a nearby PoP,
# measured). Cache HITs never touch the network, so this is a good trade.

# --- Esri World Imagery (default) ---------------------------------------------
# Free public basemap, no API key and no monthly request quota. Esri's tile
# endpoint is z/y/x; the app sends z/x/y, so the captures are reordered to $z/$y/$x.
# Named captures (not $1/$2/$3) so a later regex can't silently clobber them.
location ~ ^/tiles/esri/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)$ {
    set $esri_host "server.arcgisonline.com";
    proxy_pass https://$esri_host/ArcGIS/rest/services/World_Imagery/MapServer/tile/$z/$y/$x;
    proxy_set_header Host $esri_host;
    proxy_ssl_name $esri_host;                  # SNI
    proxy_ssl_server_name on;

    # Fail over to the next resolved address fast. Default connect timeout is
    # 60s, which turned a single dead CDN address into a hung tile (and 504s /
    # browser-aborted 499s) instead of an instant retry against a live one.
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_504;

    proxy_cache tiles;
    proxy_cache_key $uri;                       # /tiles/esri/... — distinct from MapTiler's
    proxy_ignore_headers Vary Set-Cookie;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;                        # collapse concurrent misses for the same tile
    add_header X-Tile-Cache $upstream_cache_status;  # HIT/MISS/EXPIRED (handy for debugging)
    expires 30d;                                # let the browser cache too
}

# --- MapTiler satellite (kept for comparison) ---------------------------------
# The key lives in a separate root-only snippet that is NOT in the repo:
#   /etc/nginx/snippets/maptiler-key.conf  ->  set $maptiler_key "YOUR_KEY";
# Create it with:
#   echo 'set $maptiler_key "YOUR_KEY";' | sudo tee /etc/nginx/snippets/maptiler-key.conf
location ~ ^/tiles/satellite/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)$ {
    include snippets/maptiler-key.conf;        # sets $maptiler_key (host-only)

    # Same runtime-DNS treatment as Esri above. MapTiler had not broken yet only
    # because Cloudflare's 104.17.x addresses happen to be long-lived; it had the
    # identical pinned-DNS bug waiting for the next rotation.
    set $maptiler_host "api.maptiler.com";
    proxy_pass https://$maptiler_host/maps/satellite/$z/$x/$y.jpg?key=$maptiler_key;
    proxy_set_header Host $maptiler_host;
    proxy_ssl_name $maptiler_host;              # SNI
    proxy_ssl_server_name on;

    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_504;

    proxy_cache tiles;
    proxy_cache_key $uri;                       # excludes the key — secret never in the cache key
    # MapTiler sends "Vary: Origin, User-Agent"; without this nginx won't reuse a
    # cached tile across browsers/UAs and almost everything re-fetches (slow). We
    # key by URL ourselves, so caching by URL regardless of Vary is correct.
    proxy_ignore_headers Vary Set-Cookie;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;                        # collapse concurrent misses for the same tile
    add_header X-Tile-Cache $upstream_cache_status;  # HIT/MISS/EXPIRED (handy for debugging)
    expires 30d;                                # let the browser cache too
}
