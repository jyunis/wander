# Tile-proxy + cache location for Wander's satellite basemap. Included by BOTH
# server blocks in cairn.conf (so it works whether the page is loaded over http
# or https). Install: copy to /etc/nginx/snippets/wander-tiles.conf.
#
# The app requests /tiles/satellite/{z}/{x}/{y} (relative). nginx rewrites that
# to MapTiler's "hybrid" raster (satellite + labels in one tile), injecting the
# API key server-side — so the key NEVER reaches the browser — and caching the
# result to disk (zone `tiles`, defined in conf.d/tile-cache.conf).
#
# The key lives in a separate root-only snippet that is NOT in the repo:
#   /etc/nginx/snippets/maptiler-key.conf  ->  set $maptiler_key "YOUR_KEY";
# Create it with:
#   echo 'set $maptiler_key "YOUR_KEY";' | sudo tee /etc/nginx/snippets/maptiler-key.conf
location ~ ^/tiles/satellite/(\d+)/(\d+)/(\d+)$ {
    include snippets/maptiler-key.conf;        # sets $maptiler_key (host-only)

    # Proxy to the keepalive upstream (maptiler_cdn, in conf.d/tile-cache.conf).
    proxy_pass https://maptiler_cdn/maps/hybrid/$1/$2/$3.jpg?key=$maptiler_key;
    proxy_http_version 1.1;                     # required for upstream keepalive
    proxy_set_header Connection "";             # don't forward "close" — reuse the conn
    proxy_set_header Host api.maptiler.com;
    proxy_ssl_name api.maptiler.com;            # SNI hostname (we connect by upstream name)
    proxy_ssl_server_name on;

    proxy_cache tiles;
    proxy_cache_key $uri;                       # excludes the key — secret never in the cache key
    # MapTiler sends "Vary: Origin, User-Agent"; without this nginx won't reuse a
    # cached tile across browsers/UAs and almost everything re-fetches (slow). We
    # key by URL ourselves, so caching by URL regardless of Vary is correct.
    proxy_ignore_headers Vary Set-Cookie;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;                        # collapse concurrent misses for the same tile
    add_header X-Tile-Cache $upstream_cache_status;  # HIT/MISS/EXPIRED (handy for debugging)
    expires 30d;                                # let the browser cache too
}
