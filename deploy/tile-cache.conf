# nginx tile-cache zone (HTTP context — must live outside any server{} block).
# Install: copy to /etc/nginx/conf.d/tile-cache.conf, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Caches satellite tiles (Esri World Imagery + MapTiler) to the HDD so revisits
# are local and any API key stays server-side (see snippets/wander-tiles.conf).
# One shared 20 GB zone, evicted 30 days after last use; the two sources live at
# distinct /tiles/... paths so their cache keys never collide. Survives reloads.
# The dir must exist + be writable by the nginx worker user:
#   sudo mkdir -p /extra1/nginx-tile-cache && sudo chown www-data:www-data /extra1/nginx-tile-cache
proxy_cache_path /extra1/nginx-tile-cache levels=1:2 keys_zone=tiles:10m
                 max_size=20g inactive=30d use_temp_path=off;

# Runtime DNS for the tile upstreams. This MUST stay a resolver + variable
# proxy_pass (see snippets/wander-tiles.conf) rather than an `upstream` block.
#
# History: this file used to declare `upstream esri_imagery/maptiler_cdn` with
# keepalive 16, on the assumption that "anycast CDN IPs are stable enough to
# resolve once at reload." That assumption is wrong and it broke satellite
# tiles. An nginx `upstream` block resolves its server names exactly ONCE, at
# config load, and pins those addresses forever. Esri is behind CloudFront,
# whose IPs rotate every few days — so a handful of days after any reload every
# pinned Esri address was dead and each cache MISS returned 502. It read as
# "missing tiles only at close zoom" because low zoom was being served from the
# disk cache and never touched the network.
#
# ipv6=off is required, not cosmetic: this host has no IPv6 default route, but
# server.arcgisonline.com advertises 8 AAAA records to 4 A records. Without it
# two-thirds of resolved peers are unreachable and burn a connect attempt each.
#
# valid=300s re-resolves every 5 min, so a CDN IP rotation self-heals.
# 127.0.0.53 is the local systemd-resolved stub; 1.1.1.1 is the fallback for
# when it (or Tailscale's MagicDNS behind it) is unavailable.
resolver 127.0.0.53 1.1.1.1 ipv6=off valid=300s;
resolver_timeout 5s;
