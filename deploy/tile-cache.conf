# nginx tile-cache zone (HTTP context — must live outside any server{} block).
# Install: copy to /etc/nginx/conf.d/tile-cache.conf, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Caches MapTiler satellite tiles to the HDD so revisits are local and the API
# key stays server-side (see snippets/wander-tiles.conf). 20 GB ceiling, evicted
# 30 days after last use; survives reloads. The dir must exist + be writable by
# the nginx worker user:
#   sudo mkdir -p /extra1/nginx-tile-cache && sudo chown www-data:www-data /extra1/nginx-tile-cache
proxy_cache_path /extra1/nginx-tile-cache levels=1:2 keys_zone=tiles:10m
                 max_size=20g inactive=30d use_temp_path=off;

# Keep warm TLS connections to MapTiler so a cache MISS doesn't pay a fresh
# DNS+TLS handshake per tile (the main cold-load cost). Anycast CDN — the IP
# behind the name is stable enough to resolve once at reload.
upstream maptiler_cdn {
    server api.maptiler.com:443;
    keepalive 16;
}
